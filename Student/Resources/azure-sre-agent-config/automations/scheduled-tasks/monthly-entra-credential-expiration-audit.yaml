# Monthly Microsoft Entra credential expiration audit. Read-only identity-hygiene task used in
# Challenge 20. Runs on the 1st of each month at 07:00 UTC. Requires the agent managed identity to
# hold the Microsoft Graph application permission Application.Read.All (admin consent granted).
# Source: https://github.com/rcarboneras/SRE-Agent/tree/main/ScheduledTasks
api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: monthly-entra-credential-expiration-audit
spec:
  description: >-
    Monthly, read-only audit of client secrets and certificates on Entra app registrations and
    service principals. Classifies every credential by days to expiry and publishes a PDF and an
    interactive HTML report.
  schedule: "0 7 1 * *"
  time_zone: UTC
  enabled: true
  mode: Autonomous
  prompt: >-
    Perform the monthly, read-only Microsoft Entra credential-expiration audit and publish BOTH a
    PDF and a self-contained actionable HTML report. Scope: Microsoft Graph v1.0 applications and
    servicePrincipals; include passwordCredentials and keyCredentials only when endDateTime is
    present; exclude service principals whose servicePrincipalType is ManagedIdentity; use managed
    identity authentication only; follow every @odata.nextLink until the inventory is complete.
    Classify each credential: EXPIRED (endDateTime before now), CRITICAL (0-7 days), EXPIRING SOON
    (more than 7 and up to 30 days), EXPIRING (more than 30 and up to 90 days), Valid (more than 90
    days). Artifacts: azure-ad-credential-expiration-audit-YYYY-MM-DD.pdf and
    azure-ad-credential-expiration-audit-YYYY-MM-DD.html. The HTML embeds the inventory JSON (no
    live Graph calls on open), renders an accessible table where every column is sortable in both
    directions (dates and days-remaining sorted numerically, active sort shown, filters preserved),
    and offers credential-name search, minimum/maximum days-remaining filters, status and
    object-type filters, clear filters, filtered CSV export, and direct Entra action links.
    Validation: require a successful, non-zero Graph retrieval; reconcile report counts to the
    embedded rows; test name filtering, the maximum-30-day filter, action links, CSV download and
    sorting on every column; check the PDF title and findings text; publish both artifacts and
    return links. Safety: READ-ONLY. Do not change any credential, application, service principal,
    permission, role or Azure resource. Do not send email, notifications or tickets. If Graph
    retrieval fails, do not publish a success-shaped report.

# Monthly orphaned RBAC principal audit. Read-only governance task used in Challenge 21. Runs on the
# 1st of each month at 08:00 UTC. Requires Reader on the scopes to audit and the Microsoft Graph
# application permission Directory.Read.All (admin consent granted) on the agent managed identity.
# Source: https://github.com/rcarboneras/SRE-Agent/tree/main/ScheduledTasks
api_version: azuresre.ai/v1
kind: ScheduledTask
metadata:
  name: monthly-orphaned-rbac-principal-audit
spec:
  description: >-
    Monthly, read-only audit of Azure RBAC role assignments whose Entra principal (user, group or
    service principal) no longer exists. Produces CSV, Markdown and interactive HTML reports with
    explicit coverage warnings.
  schedule: "0 8 1 * *"
  time_zone: UTC
  enabled: true
  mode: Autonomous
  prompt: >-
    Produce a read-only, complete audit of Azure RBAC assignments at management-group,
    subscription, resource-group and tenant-root scopes whose assigned Entra principal no longer
    resolves. Include orphaned Users, Groups and Service Principals; do not modify assignments.
    Prerequisite: the agent user-assigned managed identity needs the Microsoft Graph application
    permission Directory.Read.All with admin consent; acquire Graph tokens for
    https://graph.microsoft.com/.default with that identity. If Graph returns 401, 403, consent or
    permission errors, do not classify any principal as deleted; still create all artifacts, mark
    the audit as partial coverage and report the exact missing prerequisite. Scope: enumerate every
    accessible management group, subscription and resource group plus readable tenant-root
    assignments; collect direct and inherited assignments where the APIs expose them. Verification:
    de-duplicate principal IDs and verify them with Microsoft Graph directoryObjects/getByIds; treat
    a principal as orphaned only when the directory lookup confirms it does not exist, never from a
    missing display name, an authorization failure or an incomplete Resource Graph result. Keep
    scope, scope type, principal ID, principal type, role and assignment ID for every confirmed
    orphan. Resilience: retry 408, 429 and 5xx up to three times with 2, 5 and 10 second backoff;
    continue past failed scopes and report them as coverage warnings. Artifacts: UTC-timestamped
    CSV, Markdown and self-contained HTML reports; the HTML has summary metrics, free-text search,
    scope-type and principal-type filters, Azure portal links to each scope and assignment, a Copy
    principal action, and keyboard-accessible sortable columns with aria-sort and a deterministic
    assignment-ID tie-breaker. Return download links and a count summary by principal type and
    scope type. Safety: read-only; never delete, modify or remediate RBAC assignments. If nothing
    is found, still produce the three artifacts with headers and an explicit zero-result summary.
    Clearly distinguish complete coverage from partial coverage.
